name: Daily AI Affiliate Content Automation

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Grants git push access to the runner

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-genai pytrends markdown python-dotenv requests beautifulsoup4

    - name: Run Automation Pipeline
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        AFFILIATE_TAG: ${{ secrets.AFFILIATE_TAG }}
      run: |
        python main.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add output/ index.html
        git diff --quiet || git diff --staged --quiet || (git commit -m "chore: daily automated content publish [skip ci]" && git push)
