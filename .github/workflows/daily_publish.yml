    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Configure Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-genai pytrends markdown python-dotenv requests beautifulsoup4

    - name: Run Automation Pipeline
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        AFFILIATE_TAG: ${{ secrets.AFFILIATE_TAG }}
      run: |
        python main.py

    - name: Commit and Push Changes
      run: |
        git add output/
        git diff --quiet || git diff --staged --quiet || (git commit -m "chore: daily automated content publish [skip ci]" && git push)
